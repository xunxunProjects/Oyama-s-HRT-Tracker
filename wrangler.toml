name = "hrt-tracker"
main = "worker.ts"
compatibility_date = "2025-12-04"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*", "!/assets/*"]

[observability]
enabled = true
head_sampling_rate = 1

# Required secrets (set via `wrangler secret put <NAME>`):
#   JWT_SECRET      — random string ≥ 32 chars, used to sign auth tokens
#   ADMIN_USERNAME  — (optional) username for the built-in admin account
#   ADMIN_PASSWORD  — (optional) password for the built-in admin account

[[d1_databases]]
binding = "DB"
database_name = "hrt-tracker-prod"
database_id = "916011c6-3b95-4116-a10e-76af94496170"

[[r2_buckets]]
binding = "AVATAR_BUCKET"
bucket_name = "mahiro-contents"

# Housekeeping (dead sessions, expired share payloads) — see `scheduled()` in worker.ts.
[triggers]
crons = ["17 */6 * * *"]

# Rate limiting, one binding per requests-per-minute class. Keys are prefixed
# per endpoint inside the worker, so two endpoints on the same class never
# share a bucket. `namespace_id` only has to be unique within this account.
[[ratelimits]]
name = "RL_PER_MINUTE_10"
namespace_id = "1010"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_PER_MINUTE_20"
namespace_id = "1020"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_PER_MINUTE_30"
namespace_id = "1030"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_PER_MINUTE_60"
namespace_id = "1060"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_PER_MINUTE_300"
namespace_id = "1300"
simple = { limit = 300, period = 60 }
