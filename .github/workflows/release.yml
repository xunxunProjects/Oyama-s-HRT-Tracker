name: Release

# Push a tag like v1.5.0 (after `python3 scripts/set_version.py 1.5.0` is
# committed on main) and this drafts a GitHub release, attaches the desktop
# installers and publishes it once they are all there. The Docker image for the
# same tag comes from docker-publish.yml.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Check the tag and draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main."
            exit 1
          fi

      - name: Version files match the tag
        run: python3 scripts/set_version.py --check "${TAG#v}"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "A release for $TAG already exists; the builds will add to it."
            exit 0
          fi
          notes=""
          if [ "$MAC_SIGNED" != "true" ]; then
            notes=$(cat <<'EOF'
          > **macOS:** this build is not notarized by Apple, so the first launch says Apple could not verify it is free of malware. Open the app once, then go to **System Settings → Privacy & Security** and click **Open Anyway**. Or run `xattr -dr com.apple.quarantine "/Applications/Oyama's HRT Tracker.app"` in Terminal.
          >
          > **macOS：** 此版本未经 Apple 公证，首次打开时会提示“无法验证是否包含恶意软件”。先尝试打开一次，然后前往 **系统设置 → 隐私与安全性**，点击 **仍要打开**；或在终端运行上面的 `xattr` 命令。
          EOF
            )
          fi
          gh release create "$TAG" --draft --verify-tag --generate-notes \
            --title "Oyama's HRT Tracker ${TAG#v}" --notes "$notes"

  desktop:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # One .dmg that runs on both Apple silicon and Intel Macs.
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            build-args: --target universal-apple-darwin
            bundles: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            rust-targets: ""
            build-args: ""
            bundles: src-tauri/target/release/bundle/msi/*.msi
    env:
      # Desktop builds load the app from a custom protocol, so relative /api
      # URLs cannot reach the Worker. Forks set the VITE_API_ORIGIN repository
      # variable to their own origin.
      VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN || 'https://hrt.mahiro.uk' }}
      RUST_TARGETS: ${{ matrix.rust-targets }}
      BUILD_ARGS: ${{ matrix.build-args }}
      BUNDLES: ${{ matrix.bundles }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          if [ -n "$RUST_TARGETS" ]; then rustup target add $RUST_TARGETS; fi

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        env:
          # macOS signing and notarization. With an Apple Developer ID in these
          # repository secrets the bundler signs with it and has Apple notarize
          # the app, so it opens without a warning. Without them, the empty
          # values are dropped below and tauri.conf.json's ad-hoc signature is
          # used instead, which macOS lets the user allow once.
          #   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
          #   APPLE_CERTIFICATE_PASSWORD  that .p12's password
          #   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
          #   APPLE_ID                    Apple Account email
          #   APPLE_PASSWORD              an app-specific password for it
          #   APPLE_TEAM_ID               the 10-character team ID
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # The bundler acts on these being set at all, so an empty one has to
          # be unset rather than left blank.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          npm run tauri:build -- $BUILD_ARGS

      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Signature|TeamIdentifier|Authority)' || true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # $BUNDLES is left unquoted so its glob expands; a glob that matches
        # nothing stays literal and makes the upload fail, as it should.
        run: gh release upload "$TAG" $BUNDLES --clobber

  publish:
    name: Publish the release
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest
