name: Release

# Push a tag like v1.5.0 (after `python3 scripts/set_version.py 1.5.0` is
# committed on main) and this drafts a GitHub release, attaches the desktop
# installers and publishes it once they are all there. The Docker image for the
# same tag comes from docker-publish.yml.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Check the tag and draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main."
            exit 1
          fi

      - name: Version files match the tag
        run: python3 scripts/set_version.py --check "${TAG#v}"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "A release for $TAG already exists; the builds will add to it."
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes \
              --title "Oyama's HRT Tracker ${TAG#v}"
          fi

  desktop:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # One .dmg that runs on both Apple silicon and Intel Macs.
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            build-args: --target universal-apple-darwin
            bundles: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            rust-targets: ""
            build-args: ""
            bundles: src-tauri/target/release/bundle/msi/*.msi
    env:
      # Desktop builds load the app from a custom protocol, so relative /api
      # URLs cannot reach the Worker. Forks set the VITE_API_ORIGIN repository
      # variable to their own origin.
      VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN || 'https://hrt.mahiro.uk' }}
      RUST_TARGETS: ${{ matrix.rust-targets }}
      BUILD_ARGS: ${{ matrix.build-args }}
      BUNDLES: ${{ matrix.bundles }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          if [ -n "$RUST_TARGETS" ]; then rustup target add $RUST_TARGETS; fi

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri:build -- $BUILD_ARGS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # $BUNDLES is left unquoted so its glob expands; a glob that matches
        # nothing stays literal and makes the upload fail, as it should.
        run: gh release upload "$TAG" $BUNDLES --clobber

  publish:
    name: Publish the release
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest
