name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Versions agree
        # package.json, package-lock.json, tauri.conf.json, Cargo.toml and
        # Cargo.lock must all carry one version; set_version.py writes them.
        run: python3 scripts/set_version.py --check

      - name: Typecheck
        # Covers the web app and worker.ts alike.
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
