name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Versions agree
        # package.json, package-lock.json, tauri.conf.json, Cargo.toml and
        # Cargo.lock must all carry one version; set_version.py writes them.
        run: python3 scripts/set_version.py --check

      - name: Lint
        # Errors fail the build; warnings mark existing code to clean up.
        run: npm run lint

      - name: Check formatting
        # `npm run format` rewrites files to match .prettierrc.json.
        run: npm run format:check

      - name: Typecheck
        # Covers the web app and worker.ts alike.
        run: npx tsc --noEmit

      - name: Unit tests
        # Dose and concentration math in logic.ts; see tests/.
        run: npm test

      - name: Build
        run: npm run build

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        # The Worker serves ./dist when it is present; building here keeps the
        # local server's startup deterministic.
        run: npm run build

      - name: Browser E2E
        # Starts Vite and `wrangler dev --local` against a throwaway D1/R2
        # store under /tmp. No Cloudflare credentials, real data, or secrets.
        run: npm run test:e2e

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
