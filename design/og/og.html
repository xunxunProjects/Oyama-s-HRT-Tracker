<!doctype html>
<html lang="en">

        <meta charset="utf-8" />
        <title>Link preview</title>
        <style>
            /* Colours and type are the app's design tokens (src/index.css, light theme). */
            :root {
                --bg: #ffffff;
                --text: oklch(20.5% 0.006 90);
                --text-muted: oklch(51.7% 0.013 90);
                --surface-muted: oklch(97.3% 0.004 90);
                --brand: #cc785c;
                --illustration-wash: oklch(97.5% 0.012 45);
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                width: 1200px;
                height: 630px;
                overflow: hidden;
                background: var(--bg);
                color: var(--text);
                /* The app's system stack. Render on a Mac so the title is in SF Pro. */
                font-family:
                    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', ui-sans-serif, system-ui,
                    'PingFang SC', 'Hiragino Sans', 'Apple SD Gothic Neo', 'Segoe UI', Inter, Helvetica, Arial,
                    sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            .card {
                position: relative;
                width: 1200px;
                height: 630px;
            }
            svg.art {
                position: absolute;
                inset: 0;
                fill: none;
                stroke: var(--brand);
                stroke-width: 1.9;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            svg.art .w {
                fill: var(--illustration-wash);
                stroke: none;
            }
            svg.art .fill {
                fill: var(--bg);
                stroke: none;
            }
            svg.art .tile {
                fill: var(--surface-muted);
                stroke: none;
            }
            svg.art .ring {
                fill: var(--bg);
                stroke-width: 3;
            }
            .words {
                position: absolute;
                left: 88px;
                top: 76px;
            }
            h1 {
                font-size: 88px;
                line-height: 1.05;
                font-weight: 600;
                letter-spacing: -0.02em;
            }
            .lede {
                font-size: 28px;
                line-height: 1.4;
                color: var(--text-muted);
                margin-top: 18px;
                max-width: 600px;
            }
            .site {
                position: absolute;
                right: 64px;
                top: 64px;
                font-size: 22px;
                font-weight: 500;
                color: var(--text-muted);
            }
        </style>
    </head>
