<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Link preview</title>
        <style>
            @font-face {
                font-family: 'Caveat';
                font-weight: 600;
                src: url(fonts/Caveat-600-normal.woff2) format('woff2');
            }
            @font-face {
                font-family: 'Newsreader';
                font-weight: 400;
                src: url(fonts/Newsreader-400-normal.woff2) format('woff2');
            }
            @font-face {
                font-family: 'Newsreader';
                font-style: italic;
                font-weight: 400;
                src: url(fonts/Newsreader-400-italic.woff2) format('woff2');
            }
            :root {
                --paper: #f6f2eb;
                --ink: #1c1a17;
                --muted: #6b6860;
                --line: #cc785c;
                --line-deep: #ac573d;
                --wash: #fbe9e0;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                width: 1200px;
                height: 630px;
                overflow: hidden;
                background: var(--paper);
                color: var(--ink);
                font-family: -apple-system, 'Helvetica Neue', Inter, system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            .card {
                position: relative;
                width: 1200px;
                height: 630px;
            }
            .grain,
            .art {
                position: absolute;
                inset: 0;
            }
            .grain {
                opacity: 0.5;
                mix-blend-mode: multiply;
            }
            .art {
                fill: none;
                stroke: var(--line);
                stroke-width: 1.9;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .art .w {
                fill: var(--wash);
                stroke: none;
            }
            .art .p {
                fill: var(--paper);
                stroke: none;
            }
            .words {
                position: absolute;
                left: 92px;
                top: 64px;
            }
            .kicker {
                display: inline-block;
                font-family: Caveat;
                font-weight: 600;
                font-size: 38px;
                color: var(--line-deep);
                transform: rotate(-2deg);
            }
            h1 {
                font-family: Newsreader;
                font-weight: 400;
                font-size: 112px;
                line-height: 1;
                letter-spacing: -2.5px;
                margin-top: 6px;
            }
            .lede em {
                font-family: Newsreader;
                font-size: 29px;
                color: var(--line-deep);
            }
            .lede {
                font-size: 26px;
                line-height: 1.4;
                color: var(--muted);
                margin-top: 18px;
                max-width: 560px;
            }
            .site {
                position: absolute;
                right: 56px;
                top: 54px;
                font-family: Newsreader;
                font-style: italic;
                font-size: 26px;
                color: var(--muted);
            }
        </style>
    </head>
