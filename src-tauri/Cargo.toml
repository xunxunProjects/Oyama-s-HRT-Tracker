[package]
name = "hrt-tracker"
version = "1.5.3"
description = "Oyama's HRT Tracker desktop app"
authors = ["SmirnovaOyama"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "^1.5", features = [] }

[dependencies]
tauri = { version = "^1.8", features = ["shell-open"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
