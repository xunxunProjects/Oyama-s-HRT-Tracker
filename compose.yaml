services:
  hrt-tracker:
    # Built from this checkout. To run a published image instead, replace these
    # three lines with: image: ghcr.io/xunxunprojects/oyama-s-hrt-tracker:latest
    build: .
    image: hrt-tracker:local
    pull_policy: build
    container_name: hrt-tracker
    init: true
    restart: unless-stopped
    ports:
      # Loopback only: put a reverse proxy (or a Tor/I2P daemon) in front.
      # Change to "8787:8787" only if you really need LAN exposure.
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    volumes:
      - ./data:/data
