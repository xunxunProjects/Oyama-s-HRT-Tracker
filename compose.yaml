services:
  hrt-tracker:
    # Built from this checkout. To run a published image instead, replace these
    # three lines with: image: ghcr.io/xunxunprojects/oyama-s-hrt-tracker:latest
    build: .
    image: hrt-tracker:local
    pull_policy: build
    container_name: hrt-tracker
    init: true
    restart: unless-stopped
    ports:
      # Defaults to loopback only: put a reverse proxy (or a Tor/I2P daemon)
      # in front. Set HRT_BIND_HOST=0.0.0.0 only for trusted LAN exposure.
      - "${HRT_BIND_HOST:-127.0.0.1}:${HRT_PORT:-8787}:8787"
    env_file:
      - .env
    volumes:
      - ./data:/data
